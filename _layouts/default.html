<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/static/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/static/img/tensorworld-logo.svg' | relative_url }}" alt="TensorWorld logo" class="brand-logo">
        <div>
          <span class="brand-name">TensorWorld</span>
          <span class="brand-tag">Tensor Computing and Systems Group</span>
        </div>
      </a>
      <nav class="top-nav" aria-label="Primary">
        <a href="{{ '/blog/' | relative_url }}"{% if page.nav == 'blog' %} class="active"{% endif %}>Blog</a>
        <a href="{{ '/' | relative_url }}"{% if page.nav == 'projects' %} class="active"{% endif %}>Projects</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.nav == 'publications' %} class="active"{% endif %}>Recent Publications</a>
        <a href="{{ '/software/' | relative_url }}"{% if page.nav == 'software' %} class="active"{% endif %}>Software</a>
        <a href="{{ '/people/' | relative_url }}"{% if page.nav == 'people' %} class="active"{% endif %}>People</a>
      </nav>
    </div>
  </header>

  <main id="top">
    {{ content }}
  </main>
</body>
</html>
