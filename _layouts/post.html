---
layout: default
nav: blog
---
<section class="content-section">
  <div class="section-header">
    <p class="section-kicker">Blog</p>
    <h2>{{ page.title }}</h2>
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %}, {{ page.author }}{% endif %}</p>
  </div>
  <article class="list-card post-content">
    {{ content }}
  </article>
  <p style="margin-top:24px;"><a href="{{ '/blog/' | relative_url }}">&larr; Back to Blog</a></p>
</section>
